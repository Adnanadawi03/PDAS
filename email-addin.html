<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDAS Email Guard — Gmail</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Segoe UI',sans-serif; font-size:13px; background:#0a0c10; color:#e8eaf0; padding:0.75rem; }
.header { display:flex; align-items:center; gap:0.5rem; margin-bottom:0.75rem; padding-bottom:0.75rem; border-bottom:1px solid rgba(255,255,255,0.07); }
.logo { font-weight:900; font-size:1rem; color:#00e5ff; letter-spacing:0.05em; }
.scan-btn { margin-left:auto; background:#00e5ff; color:#000; border:none; padding:0.4rem 1rem; border-radius:6px; font-weight:700; font-size:0.8rem; cursor:pointer; }
.scan-btn:hover { opacity:0.85; }
.scan-btn:disabled { opacity:0.5; cursor:not-allowed; }
.result { display:none; padding:0.75rem; border-radius:8px; margin-bottom:0.75rem; }
.result.allow { background:rgba(34,197,94,0.1); border:1px solid rgba(34,197,94,0.2); }
.result.warn  { background:rgba(245,158,11,0.1); border:1px solid rgba(245,158,11,0.2); }
.result.block { background:rgba(239,68,68,0.1);  border:1px solid rgba(239,68,68,0.2); }
.verdict { font-weight:700; font-size:0.9rem; display:flex; align-items:center; justify-content:space-between; }
.result.allow .verdict { color:#22c55e; }
.result.warn  .verdict { color:#f59e0b; }
.result.block .verdict { color:#ef4444; }
.score { font-size:1.1rem; font-weight:900; }
.details { font-size:0.75rem; color:#7a8499; margin-top:0.4rem; }
.not-signed { background:rgba(0,229,255,0.05); border:1px solid rgba(0,229,255,0.15); border-radius:8px; padding:0.75rem; text-align:center; }
.not-signed p { font-size:0.8rem; color:#7a8499; margin-bottom:0.5rem; }
.sign-link { color:#00e5ff; font-weight:600; font-size:0.82rem; text-decoration:none; }
.spinner { display:inline-block; width:12px; height:12px; border:2px solid rgba(255,255,255,0.1); border-top-color:#00e5ff; border-radius:50%; animation:spin 0.7s linear infinite; margin-right:0.3rem; vertical-align:middle; }
@keyframes spin { to { transform:rotate(360deg); } }
.footer-link { display:block; text-align:center; margin-top:0.5rem; font-size:0.72rem; color:#7a8499; text-decoration:none; }
.footer-link:hover { color:#00e5ff; }
</style>
</head>
<body>

<div class="header">
  <div class="logo">PDAS</div>
  <span style="font-size:0.72rem;color:#7a8499;">Gmail Guard</span>
  <button class="scan-btn" id="scanBtn" onclick="scanCurrentEmail()">⚡ Scan Email</button>
</div>

<div id="notSigned" class="not-signed" style="display:none;">
  <p>Sign in to PDAS to scan emails and sync results to your dashboard.</p>
  <a href="https://adnanadawi03.github.io/PDAS/login.html" target="_blank" class="sign-link">Sign In to PDAS →</a>
</div>

<div id="emailResult" class="result"></div>
<div id="attachmentResults"></div>
<div id="statusMsg" style="font-size:0.78rem;color:#7a8499;text-align:center;padding:0.5rem;"></div>

<a href="https://adnanadawi03.github.io/PDAS/dashboard.html" target="_blank" class="footer-link">📊 View Full Dashboard →</a>

<script>
const API_BASE     = 'https://pdas-engine.onrender.com';
const SUPABASE_URL = 'https://tzujckucxxmbxkpfkngn.supabase.co';
const SUPABASE_KEY = 'sb_publishable_bmXeOrQV8w0DIkslpprzHg_SpmVydR1';

let _session = null;

document.addEventListener('DOMContentLoaded', async function () {
  _session = await getSession();
  if (!_session) {
    document.getElementById('notSigned').style.display = 'block';
  } else {
    document.getElementById('notSigned').style.display = 'none';
    setStatus('Ready to scan. Click "Scan Email" to check this message.');
  }
});

async function getSession() {
  try {
    const keys = Object.keys(localStorage);
    for (const k of keys) {
      if (k.includes('supabase') && k.includes('auth')) {
        const d = JSON.parse(localStorage.getItem(k));
        if (d?.access_token) return d;
      }
    }
  } catch(e) {}
  return null;
}

function setStatus(msg) {
  document.getElementById('statusMsg').textContent = msg;
}

async function scanCurrentEmail() {
  const btn = document.getElementById('scanBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Scanning...';
  setStatus('');

  try {
    if (typeof google !== 'undefined' && google.script) {
      google.script.run
        .withSuccessHandler(async function(emailData) {
          await processEmailData(emailData);
          btn.disabled = false;
          btn.innerHTML = '⚡ Scan Email';
        })
        .withFailureHandler(function(err) {
          setStatus('Error reading email: ' + err.message);
          btn.disabled = false;
          btn.innerHTML = '⚡ Scan Email';
        })
        .getCurrentEmailData();
    } else {
      setStatus('Run this add-on inside Gmail to scan a real email.');
      btn.disabled = false;
      btn.innerHTML = '⚡ Scan Email';
    }
  } catch(e) {
    setStatus('Error: ' + e.message);
    btn.disabled = false;
    btn.innerHTML = '⚡ Scan Email';
  }
}

async function processEmailData(emailData) {
  const subject = emailData?.subject || '';
  const sender  = emailData?.from    || '';
  const body    = emailData?.body    || '';

  const urlRegex = /https?:\/\/[^\s"'<>]+/g;
  const urls     = [...new Set((body.match(urlRegex) || []))].slice(0, 10);

  try {
    const results  = [];
    let maxScore   = 0;
    let maxVerdict = 'allow';

    if (sender) {
      const senderUrl = 'http://' + (sender.split('@')[1] || sender);
      const r = await fetch(`${API_BASE}/scan/url`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url: senderUrl }),
        signal: AbortSignal.timeout(15000)
      });
      if (r.ok) {
        const d = await r.json();
        const score = parseFloat(d.score || 0);
        if (score > maxScore) { maxScore = score; maxVerdict = d.verdict || 'allow'; }
        results.push({ type: 'Sender Domain', target: sender, ...d });
      }
    }

    for (const url of urls.slice(0, 3)) {
      try {
        const r = await fetch(`${API_BASE}/scan/url`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url }),
          signal: AbortSignal.timeout(10000)
        });
        if (r.ok) {
          const d = await r.json();
          const score = parseFloat(d.score || 0);
          if (score > maxScore) { maxScore = score; maxVerdict = d.verdict || 'allow'; }
          results.push({ type: 'URL', target: url, ...d });
        }
      } catch(e) {}
    }

    showEmailResult(maxVerdict, maxScore, subject, sender, results, urls);

    if (_session?.access_token) {
      await saveEmailScan(sender, subject, maxVerdict, maxScore, results, urls);
    }
  } catch(e) {
    setStatus('Engine error: ' + e.message);
  }
}

function showEmailResult(verdict, score, subject, sender, results, urls) {
  const icons  = { allow:'✅', warn:'⚠️', block:'🚫' };
  const labels = { allow:'Safe Email', warn:'Suspicious Email', block:'Phishing Detected!' };
  const risk   = score >= 80 ? 'HIGH RISK' : score >= 50 ? 'MEDIUM RISK' : 'LOW RISK';

  const resultEl = document.getElementById('emailResult');
  resultEl.className = 'result ' + verdict;
  resultEl.style.display = 'block';
  resultEl.innerHTML = `
    <div class="verdict">
      <span>${icons[verdict]} ${labels[verdict]}</span>
      <span class="score">${parseFloat(score).toFixed(1)}<span style="font-size:0.65rem;opacity:0.7;">/100</span></span>
    </div>
    <div class="details">
      <b>Risk:</b> ${risk} &nbsp;|&nbsp;
      <b>From:</b> ${sender || '—'} &nbsp;|&nbsp;
      <b>URLs found:</b> ${urls.length}
    </div>
    ${results.length > 1 ? `<div class="details" style="margin-top:0.3rem;"><b>Scanned:</b> ${results.length} items</div>` : ''}`;
}

async function saveEmailScan(sender, subject, verdict, score, results, urls) {
  try {
    const pRes = await fetch(
      `${SUPABASE_URL}/rest/v1/profiles?id=eq.${_session.user.id}&select=company_id`,
      { headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${_session.access_token}` } }
    );
    const profiles   = await pRes.json();
    const company_id = profiles[0]?.company_id || null;

    await fetch(`${SUPABASE_URL}/rest/v1/scan_logs`, {
      method: 'POST',
      headers: {
        apikey: SUPABASE_KEY,
        Authorization: `Bearer ${_session.access_token}`,
        'Content-Type': 'application/json',
        Prefer: 'return=minimal'
      },
      body: JSON.stringify({
        user_id:    _session.user.id,
        company_id,
        type:       'email',
        target:     `${sender} — ${subject}`,
        verdict,
        score,
        signals:    { sender, subject, urls, results }
      })
    });
    setStatus('✓ Scan saved to your PDAS dashboard');
  } catch(e) {
    setStatus('Could not save to dashboard: ' + e.message);
  }
}
</script>
</body>
</html>
