<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PDAS — Blocked Page</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0d1117;
      color: #e6edf3;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .card {
      background: #161b22;
      border: 1px solid rgba(239,68,68,0.35);
      border-radius: 16px;
      padding: 2.5rem 2rem;
      max-width: 560px;
      width: 100%;
      text-align: center;
      box-shadow: 0 0 60px rgba(239,68,68,0.12);
    }

    .shield-icon {
      font-size: 4rem;
      margin-bottom: 1rem;
      display: block;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 700;
      color: #ef4444;
      margin-bottom: 0.5rem;
    }

    .subtitle {
      font-size: 0.92rem;
      color: #8b949e;
      margin-bottom: 1.5rem;
    }

    .score-badge {
      display: inline-block;
      background: rgba(239,68,68,0.12);
      border: 1px solid rgba(239,68,68,0.3);
      color: #ef4444;
      font-size: 1.8rem;
      font-weight: 900;
      padding: 0.5rem 1.5rem;
      border-radius: 10px;
      margin-bottom: 1.5rem;
      letter-spacing: 0.04em;
    }

    .score-label {
      font-size: 0.75rem;
      color: #8b949e;
      display: block;
      margin-top: 0.2rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .url-box {
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 0.6rem 1rem;
      font-family: monospace;
      font-size: 0.8rem;
      color: #8b949e;
      word-break: break-all;
      margin-bottom: 2rem;
      text-align: left;
    }

    .buttons {
      display: flex;
      gap: 0.75rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      padding: 0.65rem 1.4rem;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: opacity 0.15s, transform 0.1s;
    }
    .btn:hover { opacity: 0.85; transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }

    .btn-safe {
      background: #238636;
      color: #fff;
    }

    .btn-danger {
      background: transparent;
      border: 1px solid rgba(239,68,68,0.4);
      color: #ef4444;
    }

    .pdas-brand {
      margin-top: 2rem;
      font-size: 0.72rem;
      color: #484f58;
      letter-spacing: 0.08em;
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="shield-icon">🛡️</span>
    <h1>Dangerous Page Blocked</h1>
    <p class="subtitle">PDAS detected phishing indicators on this page.</p>

    <div class="score-badge">
      <span id="scoreDisplay">—</span>
      <span class="score-label">Risk Score / 100</span>
    </div>

    <div class="url-box" id="urlDisplay">Loading...</div>

    <div class="buttons">
      <button class="btn btn-safe" id="goBackBtn">✅ Go Back (Safe)</button>
      <button class="btn btn-danger" id="proceedBtn">⚠️ Proceed Anyway (Risk)</button>
    </div>

    <p class="pdas-brand">PDAS — Phishing Detection &amp; Awareness System</p>
  </div>

  <script src="blocked.js"></script>
</body>
</html>
